name: Release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Validate candidate commit and release configuration
        id: candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          UPDATE_KEY_CONFIGURED: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$CANDIDATE_COMMIT"
          version=$(jq -er '.version | strings' mygo.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Set a release version in mygo.json using MAJOR.MINOR.PATCH without leading zeros or prerelease suffixes.'
            exit 1
          fi
          if [[ "$(jq -r .updates.github mygo.json)" != "$GITHUB_REPOSITORY" ]]; then
            echo '::error::The update repository in mygo.json must match the current GitHub repository.'
            exit 1
          fi
          if [[ "$UPDATE_KEY_CONFIGURED" != 'true' ]]; then
            echo '::error::Add the MYGO_UPDATER_PRIVATE_KEY repository secret before publishing updates. See docs/releases.md.'
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: go run ./.github/scripts/releasenotes -version "$RELEASE_VERSION"

  check:
    name: Check (${{ matrix.runner }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, ubuntu-22.04]
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Check application
        uses: ./.github/actions/check-release

  report:
    name: Report release preflight
    needs: [validate, check]
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set release preflight commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          state=failure
          description='Release candidate checks did not all pass'
          if [[ "$VALIDATE_RESULT" == 'success' && "$CHECK_RESULT" == 'success' ]]; then
            state=success
            description='Release candidate passed checks on macOS, Windows and Linux'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_COMMIT" \
            -f "state=$state" \
            -f 'context=release-preflight/verified' \
            -f "description=$description" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
          test "$state" = 'success'
